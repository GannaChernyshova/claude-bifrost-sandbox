name: bifrost-local

services:
  bifrost:
    image: maximhq/bifrost:v2.3.2
    container_name: bifrost-local
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    ports:
      - "8080:8080"
    volumes:
      - bifrost-data:/app/data
      - ./config.json:/app/data/config.json:ro
      - ./pricing.json:/app/data/pricing.json:ro
      - ./model-parameters.json:/app/data/model-parameters.json:ro

volumes:
  bifrost-data:
    name: bifrost-local-data
